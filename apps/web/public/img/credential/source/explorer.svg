<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#shadow)">
    
    <!-- ==================== MAPA / BRÚJULA (fondo) ==================== -->
    
    <!-- Círculo exterior del mapa -->
    <circle cx="256" cy="256" r="110" stroke="#34D399" stroke-width="6" fill="none" />
    
    <!-- Rosa de los vientos simplificada -->
    <path d="M256 110 V 146" stroke="#059669" stroke-width="8" stroke-linecap="round" />
    <path d="M256 366 V 402" stroke="#059669" stroke-width="8" stroke-linecap="round" />
    <path d="M110 256 H 146" stroke="#059669" stroke-width="8" stroke-linecap="round" />
    <path d="M366 256 H 402" stroke="#059669" stroke-width="8" stroke-linecap="round" />
    
    <!-- Líneas de coordenadas -->
    <path d="M166 200 C 200 230, 312 230, 346 200" stroke="#34D399" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M166 312 C 200 282, 312 282, 346 312" stroke="#34D399" stroke-width="5" stroke-linecap="round" fill="none" />
    
    <!-- Estrella central -->
    <path d="M256 206 L 268 244 L 306 256 L 268 268 L 256 306 L 244 268 L 206 256 L 244 244 Z" fill="#059669" />

    <!-- ==================== LUPA (primer plano) ==================== -->
    
    <!-- Lente (con leve transparencia) -->
    <circle cx="256" cy="256" r="130" fill="#10B981" fill-opacity="0.08" stroke="#10B981" stroke-width="24" />
    
    <!-- Anillo interior -->
    <circle cx="256" cy="256" r="116" stroke="#34D399" stroke-width="4" fill="none" />
    
    <!-- Mango largo y ancho (estilo Gemini original) -->
    <!-- Base/conexión cuadrada -->
    <path d="M342 342 L 358 358" stroke="#059669" stroke-width="32" stroke-linecap="square" />
    
    <!-- Cuerpo principal del mango (más largo: hasta 440) -->
    <path d="M352 352 L 430 430" stroke="#10B981" stroke-width="32" stroke-linecap="round" />
    
    <!-- Punta decorativa -->
    <path d="M414 414 L 436 436" stroke="#059669" stroke-width="18" stroke-linecap="round" />

  </g>
</svg>