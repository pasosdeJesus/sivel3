<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Definición de la sombra sutil para el icono -->
  <defs>
    <filter id="globalFounderShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Grupo contenedor con filtro aplicado -->
  <g filter="url(#globalFounderShadow)">
    
    <!-- ELEMENTO 1: El Globo Terráqueo (Base) -->
    <!-- Silueta/Fondo del globo -->
    <circle cx="236" cy="300" r="110" fill="#10B981" fill-opacity="0.1" stroke="#34D399" stroke-width="10" />
    
    <!-- Líneas de Coordenadas (Latitud/Longitud) -->
    <!-- Línea ecuatorial y paralelos -->
    <path d="M126 300 H 346" stroke="#34D399" stroke-width="6" stroke-linecap="round" />
    <path d="M146 250 C 180 275, 292 275, 326 250" stroke="#34D399" stroke-width="5" stroke-linecap="round" />
    <path d="M146 350 C 180 325, 292 325, 326 350" stroke="#34D399" stroke-width="5" stroke-linecap="round" />
    <!-- Meridianos -->
    <path d="M236 190 V 410" stroke="#34D399" stroke-width="6" stroke-linecap="round" />
    <path d="M190 206 C 220 240, 220 360, 190 394" stroke="#34D399" stroke-width="5" stroke-linecap="round" />
    <path d="M282 206 C 252 240, 252 360, 282 394" stroke="#34D399" stroke-width="5" stroke-linecap="round" />

    <!-- ELEMENTO 2: El Mástil de la Bandera -->
    <!-- Base/Soporte del mástil incrustado en el globo -->
    <path d="M224 200 H 248" stroke="#059669" stroke-width="12" stroke-linecap="round" />
    <!-- Mástil principal vertical -->
    <path d="M236 90 V 200" stroke="#059669" stroke-width="14" stroke-linecap="round" />
    <!-- Punta dorada del mástil -->
    <circle cx="236" cy="84" r="10" fill="#FBBF24" stroke="#D97706" stroke-width="3" />

    <!-- ELEMENTO 3: La Bandera Ondeante -->
    <!-- Cuerpo de la bandera (Forma ondeante estilizada) -->
    <path d="M243 96 C 275 91, 295 111, 325 101 C 355 91, 365 106, 375 111 V 166 C 365 161, 355 146, 325 156 C 295 166, 275 146, 243 151 Z" 
          fill="#10B981" 
          stroke="#059669" 
          stroke-width="8" 
          stroke-linejoin="round" />
          
    <!-- Línea de pliegue/sombra interna en la bandera para dar dinamismo flat -->
    <path d="M305 104 C 315 125, 315 135, 307 159" stroke="#34D399" stroke-width="5" stroke-linecap="round" />

    <!-- Estrella Dorada de Fundador (Símbolo de logro/establecimiento) -->
    <g transform="translate(274, 116)">
      <path d="M 0,-12 L 3,-3 L 12,-3 L 5,2 L 8,11 L 0,6 L -8,11 L -5,2 L -12,-3 L -3,-3 Z" fill="#FBBF24" stroke="#D97706" stroke-width="2" />
    </g>

  </g>
</svg>
