<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Definición de la sombra sutil para el conjunto del icono -->
  <defs>
    <filter id="donorSilverSolidShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Grupo contenedor con filtro aplicado -->
  <g filter="url(#donorSilverSolidShadow)">
    
    <!-- ELEMENTO DE PLATA FONDADO -->
    <!-- Círculo grande con fondo relleno de plata (#E5E7EB) y borde negro -->
    <circle cx="256" cy="246" r="170" fill="#E5E7EB" stroke="#000000" stroke-width="8" />
    
    <!-- Círculo interior segmentado con borde negro (detalles sobre el fondo plata) -->
    <circle cx="256" cy="246" r="146" stroke="#000000" stroke-width="5" stroke-dasharray="12 16" fill="none"/>
    
    <!-- Estrellas decorativas de plata en la base del anillo con borde negro sutil -->
    <path d="M226 400 L230 408 L238 410 L232 416 L234 424 L226 420 L218 424 L220 416 L214 410 L222 408 Z" fill="#9CA3AF" stroke="#000000" stroke-width="2" />
    <path d="M256 406 L260 414 L268 416 L262 422 L264 430 L256 426 L248 430 L250 422 L244 416 L252 414 Z" fill="#D1D5DB" stroke="#000000" stroke-width="2" />
    <path d="M286 400 L290 408 L298 410 L292 416 L294 424 L286 420 L278 424 L280 416 L274 410 L282 408 Z" fill="#9CA3AF" stroke="#000000" stroke-width="2" />

    <!-- ELEMENTO CENTRAL PRINCIPAL: Corazón (Mismo concepto "Donor") -->
    <path d="M256 375 C 248 367 144 280 144 202 C 144 153 181 120 226 120 C 241 120 249 127 256 134 C 263 127 271 120 286 120 C 331 120 368 153 368 202 C 368 280 264 367 256 375 Z" 
          fill="#10B981" 
          stroke="#059669" 
          stroke-width="8" 
          stroke-linejoin="round" />

    <!-- Línea de acento interior del corazón -->
    <path d="M162 194 C 162 164 187 139 218 139" 
          stroke="#34D399" 
          stroke-width="6" 
          stroke-linecap="round" fill="none"/>

    <!-- Gota de Agua/Donación (En el centro del corazón) -->
    <!-- Contorno de la gota -->
    <path d="M256 202 C 231 239 231 268 256 268 C 281 268 281 239 256 202 Z" 
          fill="#059669" />
          
    <!-- Cuerpo principal de la gota -->
    <path d="M256 210 C 236 240 236 263 256 263 C 276 263 276 240 256 210 Z" 
          fill="#34D399" />

    <!-- Destello blanco flat dentro de la gota -->
    <path d="M253 222 C 245 235 245 247 250 254" 
          stroke="#FFFFFF" 
          stroke-width="4" 
          stroke-linecap="round" fill="none" />

  </g>
</svg>
