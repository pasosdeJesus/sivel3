<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Definición de la sombra sutil para el icono -->
  <defs>
    <filter id="donorShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Grupo contenedor con filtro aplicado -->
  <g filter="url(#donorShadow)">
    
    <!-- Corazón Central Estilizado -->
    <path d="M256 405 C 246 395 120 290 120 195 C 120 135 165 95 220 95 C 238 95 248 103 256 112 C 264 103 274 95 292 95 C 347 95 392 135 392 195 C 392 290 266 395 256 405 Z" 
          fill="#10B981" 
          stroke="#059669" 
          stroke-width="12" 
          stroke-linejoin="round" />

    <!-- Línea de acento interior para dar volumen flat al corazón -->
    <path d="M142 185 C 142 148 172 118 210 118" 
          stroke="#34D399" 
          stroke-width="8" 
          stroke-linecap="round"
          fill="none" />

    <!-- Elemento de Gota de Agua/Donación (Superpuesto en el centro) -->
    <!-- Contorno oscuro de la gota para contraste -->
    <path d="M256 195 C 226 240 226 275 256 275 C 286 275 286 240 256 195 Z" 
          fill="#059669" />
          
    <!-- Cuerpo principal de la gota -->
    <path d="M256 205 C 232 241 232 269 256 269 C 280 269 280 241 256 205 Z" 
          fill="#34D399" />

    <!-- Destello/Reflejo flat dentro de la gota -->
    <path d="M252 220 C 242 235 242 250 248 258" 
          stroke="#FFFFFF" 
          stroke-width="4" 
          stroke-linecap="round" fill="none" />

  </g>
</svg>
