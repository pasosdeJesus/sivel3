<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Definición de la sombra sutil para el conjunto del icono -->
  <defs>
    <filter id="donorDiamondShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Grupo contenedor con filtro aplicado -->
  <g filter="url(#donorDiamondShadow)">
    
    <!-- ELEMENTO DE DIAMANTE: Anillo geométrico perimetral estilizado -->
    <!-- Círculo exterior de diamante (azul claro) -->
    <circle cx="256" cy="246" r="170" stroke="#60A5FA" stroke-width="12" />
    <!-- Círculo interior segmentado (azul oscuro) -->
    <circle cx="256" cy="246" r="146" stroke="#2563EB" stroke-width="6" stroke-dasharray="12 16" />
    
    <!-- Pequeños diamantes / gemas facetadas en la base del anillo -->
    <!-- Gema Izquierda -->
    <g transform="translate(226, 412)">
      <path d="M 0,-14 L 14,0 L 0,14 L -14,0 Z" fill="#60A5FA" />
      <path d="M 0,-14 L 0,14 L -14,0 Z" fill="#3B82F6" opacity="0.3" /> <!-- Faceta izquierda sombreada -->
    </g>
    
    <!-- Gema Central (Ligeramente más grande) -->
    <g transform="translate(256, 418)">
      <path d="M 0,-18 L 18,0 L 0,18 L -18,0 Z" fill="#93C5FD" />
      <path d="M 0,-18 L 0,18 L -18,0 Z" fill="#60A5FA" opacity="0.4" /> <!-- Faceta izquierda sombreada -->
    </g>
    
    <!-- Gema Derecha -->
    <g transform="translate(286, 412)">
      <path d="M 0,-14 L 14,0 L 0,14 L -14,0 Z" fill="#60A5FA" />
      <path d="M 0,-14 L 0,14 L -14,0 Z" fill="#3B82F6" opacity="0.3" /> <!-- Faceta izquierda sombreada -->
    </g>

    <!-- ELEMENTO CENTRAL PRINCIPAL: Corazón (Mismo concepto "Donor") -->
    <path d="M256 375 C 248 367 144 280 144 202 C 144 153 181 120 226 120 C 241 120 249 127 256 134 C 263 127 271 120 286 120 C 331 120 368 153 368 202 C 368 280 264 367 256 375 Z" 
          fill="#10B981" 
          stroke="#059669" 
          stroke-width="8" 
          stroke-linejoin="round" />

    <!-- Línea de acento interior del corazón -->
    <path d="M162 194 C 162 164 187 139 218 139" 
          stroke="#34D399" 
          stroke-width="6" 
          stroke-linecap="round" />

    <!-- Gota de Agua/Donación (En el centro del corazón) -->
    <!-- Contorno de la gota -->
    <path d="M256 202 C 231 239 231 268 256 268 C 281 268 281 239 256 202 Z" 
          fill="#059669" />
          
    <!-- Cuerpo principal de la gota -->
    <path d="M256 210 C 236 240 236 263 256 263 C 276 263 276 240 256 210 Z" 
          fill="#34D399" />

    <!-- Destello blanco flat dentro de la gota -->
    <path d="M253 222 C 245 235 245 247 250 254" 
          stroke="#FFFFFF" 
          stroke-width="4" 
          stroke-linecap="round" fill="none" />

  </g>
</svg>
