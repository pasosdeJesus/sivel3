# Workspace raíz: una sola instalación, un solo lockfile y versiones compartidas
# por catálogo. Las apps viven en apps/web (Next.js) y apps/contracts (Hardhat).
packages:
  - 'apps/*'
  - 'packages/*'
  # Motores vendorizados: se consumen con `link:` desde apps/web y son miembros
  # del workspace para que instalen sus propias dependencias.
  - 'apps/web/packages/generated/*'

# Versión única por dependencia: las apps escriben `"catalog:"`.
catalog:
  # ecosistema
  '@pasosdejesus/m': ^0.37.2
  '@pasosdejesus/mpdj': ^0.3.2
  '@pasosdejesus/contract-test': ^0.2.3
  '@pasosdejesus/edr': ^0.1.1
  '@pasosdejesus/usdt': ^0.1.1
  # compartidas por apps/web y apps/contracts
  typescript: ^5.9.3
  viem: ^2.55.16
  dotenv: ^17.4.2

# pnpm 11 aplica `minimumReleaseAge` (24 h) y rechaza un lockfile con paquetes
# publicados hace menos de 24 h. Los del ecosistema se excluyen.
minimumReleaseAgeExclude:
  - '@pasosdejesus/*'

# Paquetes con script de instalación (OpenBSD/adJ).
allowBuilds:
  '@pasosdejesus/m': true
  '@swc/core': true
  blake-hash: true
  bufferutil: true
  esbuild: true
  keccak: true
  secp256k1: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true

# `link:` de los motores vendorizados en apps/web.
linkWorkspacePackages: true

# Migrado del campo `pnpm.overrides` de apps/web/package.json.
overrides:
  '@parcel/watcher': npm:@parcel/watcher-wasm
  rollup: npm:@rollup/wasm-node
  lightningcss: npm:lightningcss-wasm@1.32.0
  '@tailwindcss/oxide': npm:@tailwindcss/oxide-wasm32-wasi
  'esbuild@<=0.24.2': '>=0.25.0'
  'diff@>=6.0.0 <8.0.3': '>=8.0.3'
  'serialize-javascript@<=7.0.2': '>=7.0.3'
  'vite@<=6.4.1': 6.4.3
  'ws@>=8.0.0 <8.20.1': '>=8.20.1'
  'serialize-javascript@>=5.0.0 <7.0.5': '>=7.0.5'
  'uuid@<11.1.1': '>=11.1.1'
  'vite@<=6.4.2': 6.4.3
  'ws@>=8.0.0 <8.21.0': '>=8.21.0'
  'axios@>=1.0.0 <1.18.0': '>=1.18.0'
  'axios@>=1.7.0 <1.18.0': '>=1.18.0'
  'axios@>=1.15.0 <1.18.0': '>=1.18.0'
  'axios@>=1.15.2 <1.18.0': '>=1.18.0'
  'axios@>=1.15.1 <1.18.0': '>=1.18.0'
